name: "Windows MSVC CI"

on:
  push:
    branches: [ "main", "devel" ]
  pull_request:
    branches: [ "main", "devel" ]
  workflow_dispatch:

env:
  BUILD_TYPE: RelWithDebInfo
  INSTALL_LOCATION: ${{github.workspace}}/cmakebug

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        codecs: [ON, OFF]
        os: ["windows-2022", "windows-2025"]
        include:
          - { icon: '🟦', os: "windows-2022" }
          - { icon: '🟧', os: "windows-2025" }
    runs-on: ${{ matrix.os }}
    name: '${{ matrix.icon }} MSVC ${{ matrix.os }}'

    steps:
    - uses: actions/checkout@v7

    - name: '${{ matrix.icon }} Install Qt'
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.*' # bug https://github.com/miurahr/aqtinstall/issues/1007
        target: desktop
        modules: qt5compat
        cache: true

    - name: '${{ matrix.icon }} Setup MSVC'
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: "win64"

    - name: '${{ matrix.icon }} Configure CMake'
      id: configuration
      run: >
        cmake -G Ninja -B ${{github.workspace}}/build
        -DUSE_TEXT_CODECS=${{matrix.codecs}}
        -DCMAKE_PREFIX_PATH=${{env.QT_ROOT_DIR}}
        -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -DCMAKE_INSTALL_PREFIX=${{env.INSTALL_LOCATION}}

    - name: '${{ matrix.icon }} Build'
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: '${{ matrix.icon }} Install'
      run: cmake --install ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}
